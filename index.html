<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#101827"/>
<title>代行 GPS METER v0.2</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#101827;color:#eef5ff}body{margin:0;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px)}main{max-width:530px;margin:auto}h1{font-size:1.3rem;margin:8px 0 18px}h1 span{color:#94a9bc;font-size:.77rem;font-weight:400}section{background:#1b2c40;border-radius:18px;padding:24px 10px;text-align:center}.lbl{color:#b7c8d9;font-size:.88rem}.fare{font-size:clamp(3rem,15vw,5rem);font-weight:800;color:#7deeb0;margin:6px}.dist{font-size:2.4rem;font-weight:700;margin:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}button{border:0;border-radius:12px;padding:17px 8px;font-weight:700;font-size:1.04rem;color:white;background:#334963}button:disabled{opacity:.35}.start{background:#137c52}.pause{background:#a97423}.finish{background:#265a9a}.reset{background:#713d4c}.status{padding:12px 4px;line-height:1.6;font-size:.95rem}.hint{color:#a8bacb;font-size:.82rem;line-height:1.7}.warning{margin-top:15px;background:#382e23;color:#f2d8a9;border-radius:12px;padding:11px;font-size:.82rem}.good{color:#78e8a9}.bad{color:#ffbc86}pre{white-space:pre-wrap;word-break:break-word;font:inherit}
</style>
</head><body><main>
<h1>🚕 代行 GPS METER <span>Ver.0.2 試作</span></h1>
<section><div class="lbl">現在料金（仮計算）</div><div id="fare" class="fare">¥2,000</div><div class="lbl">計測距離</div><div id="distance" class="dist">0.00 km</div></section>
<div class="grid"><button class="start" id="start">▶ 開始</button><button class="pause" id="pause" disabled>⏸ 一時停止</button><button class="finish" id="finish" disabled>■ 終了</button><button class="reset" id="reset">↻ リセット</button></div>
<div class="status">状態：<strong id="state">待機中</strong><br>GPS精度：<strong id="accuracy">未取得</strong><br>GPS記録点：<strong id="points">0</strong></div>
<p class="hint">最初に「開始」を押すと位置情報の許可を求めます。許可してください。GPSの精度が悪い測位点（30m超）や、不自然な移動は距離に加算しません。</p>
<p class="warning">⚠️ 検証専用。お客様への請求額の決定には使わないでください。iPhoneの画面をロックするとSafariの位置取得が停止する場合があります。料金は2kmまで2,000円、以降400mごとに100円を切り上げ加算する仮仕様です。</p>
</main><script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let distance=0,watchId=null,last=null,points=0,mode='idle';
const R=6371000;
function hav(a,b){const rad=Math.PI/180;const dLat=(b.latitude-a.latitude)*rad,dLon=(b.longitude-a.longitude)*rad;const s=Math.sin(dLat/2)**2+Math.cos(a.latitude*rad)*Math.cos(b.latitude*rad)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(s)))}
function draw(){const fare=2000+Math.max(0,Math.ceil((distance-2000-1e-7)/400))*100;$('fare').textContent='¥'+fare.toLocaleString('ja-JP');$('distance').textContent=(distance/1000).toFixed(2)+' km';$('points').textContent=String(points);$('start').disabled=mode==='running'||mode==='finished';$('pause').disabled=mode!=='running';$('finish').disabled=mode==='idle'||mode==='finished';$('start').textContent=mode==='paused'?'▶ 再開':'▶ 開始'}
function state(s,cls){$('state').textContent=s;$('state').className=cls||''}
function stopWatch(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}last=null}
function onPosition(p){if(mode!=='running')return;const c=p.coords;$('accuracy').textContent=Math.round(c.accuracy)+' m';if(c.accuracy>30){state('精度が悪いため待機','bad');last=null;return}const next={latitude:c.latitude,longitude:c.longitude,time:p.timestamp,accuracy:c.accuracy};points++;if(last){const dt=(next.time-last.time)/1000;const d=hav(last,next);if(dt>0 && d<=Math.max(15,dt*45) && d>=Math.max(3,(last.accuracy+next.accuracy)*0.25)){distance+=d}else if(dt>0 && d>dt*45){state('不自然な位置飛びを除外','bad')}}last=next;draw()}
function onError(e){stopWatch();mode='paused';state('GPSエラー：'+e.message,'bad');draw()}
$('start').onclick=()=>{if(!window.isSecureContext){state('HTTPSで開いてください','bad');return}if(!navigator.geolocation){state('GPSに対応していません','bad');return}mode='running';last=null;state('GPS測位中…');draw();try{watchId=navigator.geolocation.watchPosition(onPosition,onError,{enableHighAccuracy:true,maximumAge:0,timeout:20000})}catch(e){onError({message:e.message})}};
$('pause').onclick=()=>{stopWatch();mode='paused';state('一時停止');draw()};
$('finish').onclick=()=>{if(!confirm('計測を終了しますか？'))return;stopWatch();mode='finished';state('計測終了');draw()};
$('reset').onclick=()=>{if(!confirm('距離と料金をリセットしますか？'))return;stopWatch();distance=0;points=0;mode='idle';$('accuracy').textContent='未取得';state('待機中');draw()};
window.addEventListener('pagehide',()=>{if(mode==='running'){stopWatch();mode='paused';state('ページが閉じられたため計測停止','bad');draw()}});
draw();
})();
</script></body></html>
